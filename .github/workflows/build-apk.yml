name: Build GainTrack APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GainTrack-v4.0.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "GainTrack v4.0.0 (Workout + Nutrition APK)"
          body: |
            ## GainTrack 4.0.0 – Equipment-Free Strength Coach

            ### 📱 Installation Instructions for Samsung Galaxy A15:
            1. Download the `app-debug.apk` file attached below directly to your Samsung phone.
            2. Open the downloaded file.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and launch **GainTrack**! 💪

            ### Features
            - **Workout-only**: Nutrition, Gemini photo scanning and API-key setup have been removed.
            - **Focused navigation**: Today, Plan, Progress — no unnecessary tabs.
            - **4-Day Home Strength Plan**: Mon/Tue/Thu/Sat, no equipment needed.
            - **Personalized Push-ups**: Difficulty can match your current consecutive repetitions.
            - **Guided Workout Logging**: Tap sets, view progress, and use the new rest countdown.
            - **Progress Tracking**: Completed workouts, 12-week consistency, weight milestone.
            - **Offline and Private**: No internet permission required. Exercise guide links open externally.
            - **Compatibility**: Install on top of v3 to preserve existing local data.

            ### Before installing
            Install over the previous app; do not uninstall or clear app storage first. This is a debug APK.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
