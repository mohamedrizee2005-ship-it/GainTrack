name: Build GainTrack APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GainTrack-v3.0.1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: "GainTrack v3.0.1 (Workout + Nutrition APK)"
          body: |
            ## GainTrack 3.0.1 – Workout + Nutrition Coach

            ### 📱 Installation Instructions for Samsung Galaxy A15:
            1. Download the `app-debug.apk` file attached below directly to your Samsung phone.
            2. Open the downloaded file.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and launch **GainTrack**! 💪

            ### Features in this release:
            - **Personalized Profile**: 47 kg baseline, 55 kg goal, BMI 16.9 with safe progress guidance.
            - **4-Day Home Workout System**: Personalized no-equipment training with upper-body focus, recovery days, and light legs.
            - **Active Workout Execution**: Interactive set logger, rest countdown timer, form & safety reminders.
            - **Nutrition Dashboard**: Daily calorie and protein tracking, meal diary, manual entries, and Sri Lankan food logging.
            - **AI Food Camera**: Optional Gemini photo estimates with portion and ingredient notes. Requires a user-provided Gemini key held in process memory; now includes more useful quota, connectivity, and authentication error messages. Food-photo estimates remain approximate.
            - **Daily Food Coach**: Practical calorie/protein guidance and balanced meal suggestions.
            - **Progress & Analytics**: Workout completion and nutrition totals.
            - **Local Notifications**: Configurable evening workout reminder (7:30 PM), Sunday check-in (7:00 PM), and nutrition reminders.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
