name: Build GainTrack APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GainTrack-v2.0.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "GainTrack v2.0.0 (Personal Bodyweight Workout APK)"
          body: |
            ## GainTrack 2.0 – Personal Bodyweight Workout

            ### 📱 Installation Instructions for Samsung Galaxy A15:
            1. Download the `app-debug.apk` file attached below directly to your Samsung phone.
            2. Open the downloaded file.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and launch **GainTrack**! 💪

            ### Features in this release:
            - **Personalized Profile**: 47 kg baseline, 55 kg goal, BMI 16.7 with safe progress guidance.
            - **4-Day Home Workout System**: Chest/Shoulders/Triceps, Legs/Core, Back/Biceps, Full Body with progressive backpack loading.
            - **Active Workout Execution**: Interactive set logger, rest countdown timer, form & safety reminders.
            - **Sri Lankan Food Tracker**: Preloaded with rice, dhal, chicken, fish ambul thiyal, milk, peanuts, and 1-tap weight-gain shake (+580 kcal).
            - **Progress & Analytics**: Canvas weight trend chart, weekly consistency bars, 12-week 3-phase journey.
            - **Local Notifications**: Configurable evening workout reminder (7:30 PM), Sunday check-in (7:00 PM), and nutrition reminders.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
